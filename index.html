<!DOCTYPE html> <html lang="zh-CN" class="dark"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>OmniDisk - 多云网盘解析助手</title>     <!-- Tailwind CSS CDN -->     <script src="https://cdn.tailwindcss.com"></script>     <script>         tailwind.config = {             darkMode: 'class',             theme: {                 extend: {                     colors: {                         ios: {                             blue: '#007AFF',                             green: '#34C759',                             indigo: '#5856D6',                             orange: '#FF9500',                             pink: '#FF2D55',                             purple: '#AF52DE',                             red: '#FF3B30',                             teal: '#5AC8FA',                             yellow: '#FFCC00',                             gray: '#8E8E93',                             bgLight: '#F2F2F7',                             bgDark: '#000000',                             cardLight: '#FFFFFF',                             cardDark: '#1C1C1E',                             borderLight: '#C6C6C8',                             borderDark: '#38383A'                         }                     }                 }             }         }     </script>     <!-- Lucide Icons -->     <script src="https://unpkg.com/lucide@latest"></script>     <style>         body {             font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;             -webkit-user-select: none;             user-select: none;             -webkit-tap-highlight-color: transparent;         }         /* Hide scrollbar for Chrome, Safari and Opera */         .no-scrollbar::-webkit-scrollbar {             display: none;         }         /* Hide scrollbar for IE, Edge and Firefox */         .no-scrollbar {             -ms-overflow-style: none;  /* IE and Edge */             scrollbar-width: none;  /* Firefox */         }     </style> </head> <body class="bg-ios-bgLight dark:bg-ios-bgDark text-black dark:text-white h-screen flex flex-col overflow-hidden">      <!-- 主体内容视图区 -->     <main id="app-container" class="flex-1 overflow-y-auto no-scrollbar pb-24 pt-safe">         <!-- 动态渲染页面 -->     </main>      <!-- 底部原生 Tabbar -->     <nav aria-label="底部导航" class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-[#1C1C1E]/80 backdrop-blur-xl border-t border-gray-200 dark:border-[#38383A] pb-safe z-50">         <div class="flex justify-around items-center h-12">             <button onclick="switchTab('parse')" id="tab-parse" class="flex flex-col items-center justify-center w-full text-ios-blue">                 <i data-lucide="link" class="w-6 h-6"></i>                 <span class="text-[10px] mt-0.5 font-medium">解析</span>             </button>             <button onclick="switchTab('download')" id="tab-download" class="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 relative">                 <i data-lucide="download-cloud" class="w-6 h-6"></i>                 <span class="text-[10px] mt-0.5 font-medium">下载</span>                 <span id="badge-download" class="absolute top-1 right-5 bg-ios-red text-white text-[9px] px-1 rounded-full hidden">2</span>             </button>             <button onclick="switchTab('files')" id="tab-files" class="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500">                 <i data-lucide="folder" class="w-6 h-6"></i>                 <span class="text-[10px] mt-0.5 font-medium">文件</span>             </button>             <button onclick="switchTab('accounts')" id="tab-accounts" class="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500">                 <i data-lucide="users" class="w-6 h-6"></i>                 <span class="text-[10px] mt-0.5 font-medium">账号</span>             </button>             <button onclick="switchTab('settings')" id="tab-settings" class="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500">                 <i data-lucide="settings" class="w-6 h-6"></i>                 <span class="text-[10px] mt-0.5 font-medium">设置</span>             </button>         </div>     </nav>      <!-- 全局弹窗/播放器层 -->     <div id="modal-container"></div>     <div id="toast-container" class="fixed top-12 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none">         <div class="bg-black/80 backdrop-blur-md text-white px-4 py-2 rounded-full text-sm shadow-lg flex items-center gap-2">             <i data-lucide="check-circle-2" class="w-4 h-4 text-ios-green"></i>             <span id="toast-text">操作成功</span>         </div>     </div>      <!-- 核心逻辑 JS -->     <script>         // 全局状态管理         let currentTab = 'parse';         let settings = {             theme: 'dark', // light, dark, system             wifiOnly: true,             notify: true,             threads: 64         };          // 网盘账号矩阵数据         let accounts = [             { id: 'baidu', name: '百度网盘', status: 'bound', user: 'OmniUser_01', color: 'bg-blue-500' },             { id: 'aliyun', name: '阿里云盘', status: 'bound', user: 'VIP会员_Pro', color: 'bg-orange-500' },             { id: 'quark', name: '夸克网盘', status: 'unbound', user: '', color: 'bg-cyan-500' },             { id: 'xunlei', name: '迅雷云盘', status: 'bound', user: 'FastDownload', color: 'bg-indigo-600' },             { id: 'uc', name: 'UC网盘', status: 'unbound', user: '', color: 'bg-amber-500' },             { id: 'p123', name: '123云盘', status: 'unbound', user: '', color: 'bg-purple-600' },             { id: 'lanzou', name: '蓝奏云', status: 'unbound', user: '', color: 'bg-pink-500' }         ];          // 下载任务列表 (大厂完整生命周期分类)         let downloadTasks = [             { id: 1, name: 'iOS_16.2_Developer_Beta.ipsw', size: '14.2 GB', speed: '28.5 MB/s', progress: 68, status: 'downloading', cloud: '阿里云盘' },             { id: 2, name: '【高清电影】星际穿越 4K 压制版.mkv', size: '21.5 GB', speed: '0 KB/s', progress: 100, status: 'completed', cloud: '百度网盘' },             { id: 3, name: '全套前端架构高阶视频教程.zip', size: '4.8 GB', speed: '0 KB/s', progress: 42, status: 'paused', cloud: '迅雷云盘' },             { id: 4, name: '重构项目资料包_V3.2.rar', size: '850 MB', speed: '0 KB/s', progress: 15, status: 'failed', cloud: '123云盘' }         ];          let activeDownloadTab = 'all'; // all, downloading, completed, failed          // 本地已完成文件库         let localFiles = [             { id: 1, name: '【高清电影】星际穿越 4K 压制版.mkv', size: '21.5 GB', date: '2026-03-01', type: 'video' },             { id: 2, name: 'OmniDisk_Setup_Guide.pdf', size: '12.4 MB', date: '2026-02-28', type: 'doc' }         ];          // 切换导航         function switchTab(tab) {             currentTab = tab;             document.querySelectorAll('nav button').forEach(btn => {                 btn.className = "flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500";             });             document.getElementById(`tab-${tab}`).className = "flex flex-col items-center justify-center w-full text-ios-blue";             render();         }          // 弹出提示框         function showToast(msg) {             const toast = document.getElementById('toast-container');             document.getElementById('toast-text').innerText = msg;             toast.classList.remove('opacity-0', 'pointer-events-none');             setTimeout(() => {                 toast.classList.add('opacity-0', 'pointer-events-none');             }, 2000);         }          // 渲染主逻辑         function render() {             const container = document.getElementById('app-container');             if (currentTab === 'parse') container.innerHTML = renderParsePage();             else if (currentTab === 'download') container.innerHTML = renderDownloadPage();             else if (currentTab === 'files') container.innerHTML = renderFilesPage();             else if (currentTab === 'accounts') container.innerHTML = renderAccountsPage();             else if (currentTab === 'settings') container.innerHTML = renderSettingsPage();              lucide.createIcons();         }          // 1. 解析页面         function renderParsePage() {             return `                 <div class="px-4 py-3">                     <div class="flex justify-between items-center mb-4">                         <h1 class="text-2xl font-bold tracking-tight">OmniDisk</h1>                         <span class="text-xs bg-ios-blue/10 text-ios-blue px-2.5 py-1 rounded-full font-semibold">TrollStore 优化版</span>                     </div>                      <!-- 链接输入框卡片 -->                     <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A] mb-5">                         <label class="block text-xs font-semibold text-gray-400 dark:text-gray-500 mb-2 uppercase">输入网盘分享链接</label>                         <textarea id="share-link-input" rows="3" class="w-full bg-gray-50 dark:bg-black/40 rounded-xl p-3 text-sm border border-gray-200 dark:border-gray-800 focus:outline-none focus:border-ios-blue resize-none" placeholder="支持 百度、阿里、夸克、迅雷、123、UC、蓝奏云等链接与提取码..."></textarea>                         <div class="flex justify-between items-center mt-3">                             <button onclick="pasteFromClipboard()" class="text-xs text-ios-blue font-medium flex items-center gap-1">                                 <i data-lucide="clipboard" class="w-3.5 h-3.5"></i>粘贴剪贴板                             </button>                             <button onclick="handleParseAction()" class="bg-ios-blue text-white px-5 py-2 rounded-xl text-sm font-medium shadow-md shadow-ios-blue/30 active:scale-95 transition-all">                                 立即解析                             </button>                         </div>                     </div>                      <!-- 功能特性快捷入口 -->                     <div class="grid grid-cols-4 gap-3 mb-6">                         <div onclick="switchTab('accounts')" class="bg-white dark:bg-ios-cardDark p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-sm cursor-pointer border border-gray-100 dark:border-[#38383A]">                             <div class="w-10 h-10 rounded-full bg-blue-500/10 text-blue-500 flex items-center justify-center mb-1.5"><i data-lucide="shield-check" class="w-5 h-5"></i></div>                             <span class="text-[11px] font-medium">账号授权</span>                         </div>                         <div onclick="switchTab('download')" class="bg-white dark:bg-ios-cardDark p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-sm cursor-pointer border border-gray-100 dark:border-[#38383A]">                             <div class="w-10 h-10 rounded-full bg-green-500/10 text-green-500 flex items-center justify-center mb-1.5"><i data-lucide="zap" class="w-5 h-5"></i></div>                             <span class="text-[11px] font-medium">多线程下载</span>                         </div>                         <div onclick="switchTab('files')" class="bg-white dark:bg-ios-cardDark p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-sm cursor-pointer border border-gray-100 dark:border-[#38383A]">                             <div class="w-10 h-10 rounded-full bg-indigo-500/10 text-indigo-500 flex items-center justify-center mb-1.5"><i data-lucide="play-circle" class="w-5 h-5"></i></div>                             <span class="text-[11px] font-medium">在线播放</span>                         </div>                         <div onclick="switchTab('settings')" class="bg-white dark:bg-ios-cardDark p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-sm cursor-pointer border border-gray-100 dark:border-[#38383A]">                             <div class="w-10 h-10 rounded-full bg-orange-500/10 text-orange-500 flex items-center justify-center mb-1.5"><i data-lucide="cpu" class="w-5 h-5"></i></div>                             <span class="text-[11px] font-medium">512线程</span>                         </div>                     </div>                      <!-- 历史解析记录 -->                     <h2 class="text-sm font-semibold text-gray-400 dark:text-gray-500 mb-3 px-1 uppercase">最近解析缓存</h2>                     <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A] space-y-3">                         <div class="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-[#38383A]">                             <div class="flex items-center gap-3">                                 <div class="w-9 h-9 rounded-xl bg-orange-500/10 text-orange-500 flex items-center justify-center"><i data-lucide="folder-archive" class="w-5 h-5"></i></div>                                 <div>                                     <p class="text-sm font-medium">阿里网盘资源包_2026.zip</p>                                     <p class="text-xs text-gray-400">1.8 GB • 阿里云盘</p>                                 </div>                             </div>                             <button onclick="addToDownload('阿里网盘资源包_2026.zip', '1.8 GB', '阿里云盘')" class="text-xs bg-ios-blue/10 text-ios-blue px-3 py-1.5 rounded-xl font-medium">下载</button>                         </div>                         <div class="flex items-center justify-between">                             <div class="flex items-center gap-3">                                 <div class="w-9 h-9 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center"><i data-lucide="video" class="w-5 h-5"></i></div>                                 <div>                                     <p class="text-sm font-medium">流浪地球3_4K超清原盘.mp4</p>                                     <p class="text-xs text-gray-400">14.5 GB • 百度网盘</p>                                 </div>                             </div>                             <button onclick="addToDownload('流浪地球3_4K超清原盘.mp4', '14.5 GB', '百度网盘')" class="text-xs bg-ios-blue/10 text-ios-blue px-3 py-1.5 rounded-xl font-medium">下载</button>                         </div>                     </div>                 </div>             `;         }          function pasteFromClipboard() {             const sample = "https://pan.baidu.com/s/1OmniDiskDemoCode 提取码:8888";             document.getElementById('share-link-input').value = sample;             showToast('已自动读取剪贴板内容');         }          function handleParseAction() {             const val = document.getElementById('share-link-input').value;             if(!val) {                 showToast('请先输入或粘贴分享链接');                 return;             }             showToast('解析成功，已生成直链任务');             addToDownload('解析资源_' + Math.floor(Math.random()*100) + '.zip', '2.3 GB', '多云聚合');         }          // 2. 下载页面（大厂全生命周期分类：全部、下载中、已完成、失败）         renderDownloadPage = function() {             const filteredTasks = downloadTasks.filter(t => {                 if(activeDownloadTab === 'all') return true;                 if(activeDownloadTab === 'downloading') return t.status === 'downloading' || t.status === 'paused';                 if(activeDownloadTab === 'completed') return t.status === 'completed';                 if(activeDownloadTab === 'failed') return t.status === 'failed';             });              return `                 <div class="px-4 py-3">                     <h1 class="text-2xl font-bold tracking-tight mb-4">下载管理</h1>                      <!-- iOS 风格分段控制器 (Segmented Control) -->                     <div class="bg-gray-200 dark:bg-[#2C2C2E] p-1 rounded-xl flex mb-4 text-xs font-medium">                         <button onclick="switchDownloadTab('all')" class="flex-1 py-1.5 rounded-lg transition-all ${activeDownloadTab==='all'?'bg-white dark:bg-[#1C1C1E] shadow-sm text-black dark:text-white':'text-gray-500'}">全部</button>                         <button onclick="switchDownloadTab('downloading')" class="flex-1 py-1.5 rounded-lg transition-all ${activeDownloadTab==='downloading'?'bg-white dark:bg-[#1C1C1E] shadow-sm text-black dark:text-white':'text-gray-500'}">下载中</button>                         <button onclick="switchDownloadTab('completed')" class="flex-1 py-1.5 rounded-lg transition-all ${activeDownloadTab==='completed'?'bg-white dark:bg-[#1C1C1E] shadow-sm text-black dark:text-white':'text-gray-500'}">已完成</button>                         <button onclick="switchDownloadTab('failed')" class="flex-1 py-1.5 rounded-lg transition-all ${activeDownloadTab==='failed'?'bg-white dark:bg-[#1C1C1E] shadow-sm text-black dark:text-white':'text-gray-500'}">异常/暂停</button>                     </div>                      <!-- 任务列表容器 -->                     <div class="space-y-3">                         ${filteredTasks.length === 0 ? `                             <div class="text-center py-16 text-gray-400">                                 <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-2 opacity-40"></i>                                 <p class="text-sm">当前分类暂无任务</p>                             </div>                         ` : filteredTasks.map(task => `                             <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A]">                                 <div class="flex justify-between items-start mb-2">                                     <div class="flex items-center gap-2.5">                                         <div class="w-8 h-8 rounded-lg bg-ios-blue/10 text-ios-blue flex items-center justify-center"><i data-lucide="file" class="w-4 h-4"></i></div>                                         <div>                                             <p class="text-sm font-semibold truncate max-w-[200px]">${task.name}</p>                                             <p class="text-[11px] text-gray-400">${task.size} • <span class="text-ios-blue">${task.cloud}</span></p>                                         </div>                                     </div>                                     <span class="text-[11px] px-2 py-0.5 rounded-md font-medium ${                                         task.status === 'downloading' ? 'bg-blue-500/10 text-blue-500' :                                         task.status === 'completed' ? 'bg-green-500/10 text-green-500' :                                         task.status === 'paused' ? 'bg-orange-500/10 text-orange-500' : 'bg-red-500/10 text-red-500'                                     }">${task.status === 'downloading' ? task.speed : task.status === 'completed' ? '已完成' : task.status === 'paused' ? '已暂停' : '下载失败'}</span>                                 </div>                                  <!-- 进度条 -->                                 <div class="w-full bg-gray-100 dark:bg-gray-800 h-2 rounded-full overflow-hidden my-2.5">                                     <div class="h-full bg-ios-blue transition-all duration-300" style="width: ${task.progress}%"></div>                                 </div>                                  <div class="flex justify-between items-center text-xs text-gray-400">                                     <span>${task.progress}% 完成</span>                                     <div class="flex gap-2">                                         ${task.status === 'downloading' ? `<button onclick="pauseTask(${task.id})" class="text-orange-500 font-medium">暂停</button>` : ''}                                         ${task.status === 'paused' || task.status === 'failed' ? `<button onclick="resumeTask(${task.id})" class="text-ios-blue font-medium">重试</button>` : ''}                                         <button onclick="deleteTask(${task.id})" class="text-red-500">删除</button>                                     </div>                                 </div>                             </div>                         `).join('')}                     </div>                 </div>             `;         }          function switchDownloadTab(tab) {             activeDownloadTab = tab;             render();         }          function addToDownload(name, size, cloud) {             downloadTasks.unshift({                 id: Date.now(),                 name, size,                 speed: '18.2 MB/s',                 progress: 12,                 status: 'downloading',                 cloud             });             showToast('已成功添加至下载队列');             switchTab('download');         }          function pauseTask(id) {             const t = downloadTasks.find(x => x.id === id);             if(t) { t.status = 'paused'; t.speed = '0 KB/s'; render(); showToast('任务已暂停'); }         }          function resumeTask(id) {             const t = downloadTasks.find(x => x.id === id);             if(t) { t.status = 'downloading'; t.speed = '22.5 MB/s'; render(); showToast('重新开始下载'); }         }          function deleteTask(id) {             downloadTasks = downloadTasks.filter(x => x.id !== id);             render();             showToast('任务已清除');         }          // 3. 本地文件与播放器页面         function renderFilesPage() {             return `                 <div class="px-4 py-3">                     <h1 class="text-2xl font-bold tracking-tight mb-4">本地资源库</h1>                     <div class="space-y-3">                         ${localFiles.map(file => `                             <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A] flex items-center justify-between">                                 <div class="flex items-center gap-3">                                     <div class="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-500 flex items-center justify-center">                                         <i data-lucide="${file.type==='video'?'film':'file-text'}" class="w-5 h-5"></i>                                     </div>                                     <div>                                         <p class="text-sm font-medium truncate max-w-[190px]">${file.name}</p>                                         <p class="text-xs text-gray-400">${file.size} • ${file.date}</p>                                     </div>                                 </div>                                 <div class="flex items-center gap-2">                                     ${file.type==='video' ? `<button onclick="playVideo('${file.name}')" class="bg-ios-blue text-white px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1"><i data-lucide="play" class="w-3 h-3"></i>播放</button>` : ''}                                     <button onclick="deleteLocalFile(${file.id})" class="p-2 text-red-500 hover:bg-red-500/10 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button>                                 </div>                             </div>                         `).join('')}                     </div>                 </div>             `;         }          function playVideo(name) {             const modal = document.getElementById('modal-container');             modal.innerHTML = `                 <div class="fixed inset-0 bg-black z-50 flex flex-col justify-between">                     <div class="flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent text-white">                         <span class="text-sm font-medium truncate">${name}</span>                         <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button>                     </div>                     <div class="flex-center flex flex-col items-center justify-center text-center p-6">                         <div class="w-20 h-20 rounded-full bg-ios-blue/20 text-ios-blue flex items-center justify-center mb-4 animate-pulse">                             <i data-lucide="play" class="w-10 h-10 ml-1"></i>                         </div>                         <p class="text-sm text-gray-300">正在通过 OmniDisk 核心解码器在线硬解播放...</p>                         <span class="text-xs text-gray-500 mt-1">支持杜比视界及自定义字幕加载</span>                     </div>                     <div class="p-6 bg-gradient-to-t from-black/80 to-transparent flex justify-center">                         <button onclick="closeModal()" class="bg-white/20 text-white px-6 py-2.5 rounded-full text-sm font-medium">关闭播放器</button>                     </div>                 </div>             `;             lucide.createIcons();         }          function closeModal() {             document.getElementById('modal-container').innerHTML = '';         }          function deleteLocalFile(id) {             localFiles = localFiles.filter(x => x.id !== id);             render();             showToast('文件已从本地删除');         }          // 4. 账号矩阵页面 (支持7大网盘)         function renderAccountsPage() {             return `                 <div class="px-4 py-3">                     <h1 class="text-2xl font-bold tracking-tight mb-1">网盘账号</h1>                     <p class="text-xs text-gray-400 mb-4">全面集成 7 大主流网盘，扫码授权直连解析</p>                      <div class="space-y-3">                         ${accounts.map(acc => `                             <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A] flex items-center justify-between">                                 <div class="flex items-center gap-3">                                     <div class="w-10 h-10 rounded-2xl ${acc.color} text-white flex items-center justify-center font-bold text-sm shadow-md">                                         ${acc.name.substring(0,2)}                                     </div>                                     <div>                                         <p class="text-sm font-semibold">${acc.name}</p>                                         <p class="text-xs text-gray-400">${acc.status === 'bound' ? '已绑定: ' + acc.user : '未授权登录'}</p>                                     </div>                                 </div>                                 <button onclick="toggleAccount('${acc.id}')" class="text-xs px-3.5 py-1.5 rounded-xl font-medium ${                                     acc.status === 'bound' ? 'bg-gray-100 dark:bg-gray-800 text-red-500' : 'bg-ios-blue text-white shadow-md shadow-ios-blue/30'                                 }">                                     ${acc.status === 'bound' ? '解除绑定' : '扫码授权'}                                 </button>                             </div>                         `).join('')}                     </div>                 </div>             `;         }          function toggleAccount(id) {             const acc = accounts.find(x => x.id === id);             if(acc.status === 'bound') {                 acc.status = 'unbound';                 acc.user = '';                 showToast(`已断开 ${acc.name} 授权`);             } else {                 acc.status = 'bound';                 acc.user = 'Omni_VIP_' + Math.floor(Math.random()*900+100);                 showToast(`成功授权连接 ${acc.name}`);             }             render();         }          // 5. 设置页面（仿大厂、存储空间、外观模式、512线程、联系我们）         function renderSettingsPage() {             return `                 <div class="px-4 py-3">                     <h1 class="text-2xl font-bold tracking-tight mb-4">系统设置</h1>                      <!-- 仿 iOS 存储空间看板 -->                     <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A] mb-4">                         <div class="flex justify-between text-xs font-medium text-gray-400 mb-2">                             <span>本地沙盒存储空间</span>                             <span>34.2 GB / 256 GB</span>                         </div>                         <div class="w-full bg-gray-100 dark:bg-gray-800 h-3 rounded-full overflow-hidden flex gap-0.5">                             <div class="bg-ios-blue h-full" style="width: 25%"></div>                             <div class="bg-purple-500 h-full" style="width: 15%"></div>                             <div class="bg-orange-500 h-full" style="width: 10%"></div>                         </div>                         <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-100 dark:border-[#38383A]">                             <span class="text-xs">清除应用临时缓存</span>                             <button onclick="showToast('缓存清理完毕 (-1.8 GB)')" class="text-xs text-ios-blue font-medium">清理</button>                         </div>                     </div>                      <!-- 核心功能配置 -->                     <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A] space-y-4 mb-4">                         <div class="flex justify-between items-center">                             <div>                                 <p class="text-sm font-medium">外观模式</p>                                 <p class="text-xs text-gray-400">支持浅色、深色及跟随系统</p>                             </div>                             <select id="theme-select" onchange="changeTheme(this.value)" class="bg-gray-100 dark:bg-black/40 text-xs px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-800">                                 <option value="dark" ${settings.theme==='dark'?'selected':''}>深色模式</option>                                 <option value="light" ${settings.theme==='light'?'selected':''}>浅色模式</option>                             </select>                         </div>                         <div class="flex justify-between items-center pt-3 border-t border-gray-100 dark:border-[#38383A]">                             <div>                                 <p class="text-sm font-medium">仅 WiFi 环境下载</p>                                 <p class="text-xs text-gray-400">避免消耗手机蜂窝移动流量</p>                             </div>                             <input type="checkbox" ${settings.wifiOnly?'checked':''} onchange="settings.wifiOnly=this.checked; showToast('设置已更新')" class="w-5 h-5 accent-ios-blue rounded">                         </div>                         <div class="flex justify-between items-center pt-3 border-t border-gray-100 dark:border-[#38383A]">                             <div>                                 <p class="text-sm font-medium">下载完成系统通知</p>                                 <p class="text-xs text-gray-400">后台驻留提醒推送</p>                             </div>                             <input type="checkbox" ${settings.notify?'checked':''} onchange="settings.notify=this.checked; showToast('通知设置已更新')" class="w-5 h-5 accent-ios-blue rounded">                         </div>                     </div>                      <!-- 巨魔专属：512 线程无极滑块控制器 -->                     <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A] mb-4">                         <div class="flex justify-between items-center mb-2">                             <span class="text-sm font-medium">最大并发下载线程</span>                             <span id="thread-val" class="text-xs font-bold text-ios-blue">${settings.threads} 线程</span>                         </div>                         <input type="range" min="1" max="512" value="${settings.threads}" oninput="updateThreads(this.value)" class="w-full accent-ios-blue cursor-pointer">                         <p class="text-[11px] text-gray-400 mt-1">TrollStore 环境支持突破限制，最高可自定义至 512 高速并发通道。</p>                     </div>                      <!-- 联系我们与反馈 -->                     <div class="bg-white dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-[#38383A] space-y-3 mb-6">                         <div class="flex justify-between items-center">                             <span class="text-sm font-medium">开发者邮箱</span>                             <a href="mailto:757011143@qq.com" class="text-xs text-ios-blue font-medium">757011143@qq.com</a>                         </div>                         <div class="flex justify-between items-center pt-3 border-t border-gray-100 dark:border-[#38383A]">                             <span class="text-sm font-medium">开源版本号</span>                             <span class="text-xs text-gray-400">OmniDisk v3.5 Pro (Build 2026)</span>                         </div>                     </div>                 </div>             `;         }          function changeTheme(val) {             settings.theme = val;             if(val === 'dark') {                 document.documentElement.classList.add('dark');             } else {                 document.documentElement.classList.remove('dark');             }             showToast('已切换至 ' + (val==='dark'?'深色模式':'浅色模式'));         }          function updateThreads(val) {             settings.threads = val;             document.getElementById('thread-val').innerText = val + ' 线程';         }          // 初始化首次运行         render();      </script> </body> </html>
