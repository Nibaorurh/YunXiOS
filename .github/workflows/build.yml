name: Build YunXiOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build YunXiOS
    runs-on: macos-14

    steps:
      # --------------------------------------------------
      # 1. 拉取仓库
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. 选择 Xcode
      # --------------------------------------------------
      - name: Select Xcode
        shell: bash
        run: |
          set -e

          echo "当前 macOS："
          sw_vers

          echo "可用 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.2.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.1.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.0.app/Contents/Developer"
          else
            echo "使用系统默认 Xcode"
          fi

          echo "Xcode 版本："
          xcodebuild -version

      # --------------------------------------------------
      # 3. 查找并解压完整源码 ZIP
      # --------------------------------------------------
      - name: Find and extract source
        shell: bash
        run: |
          set -e

          SOURCE_DIR="$RUNNER_TEMP/YunXiOSSource"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          echo "正在查找源码 ZIP..."

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "错误：没有找到 ZIP 源码文件"
            echo "仓库文件列表："
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "找到 ZIP："
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          echo "解压完成，查找 Xcode 工程："
          find "$SOURCE_DIR" \
            -name "*.xcodeproj" \
            -o -name "*.xcworkspace" \
            | sort

          echo "源码目录结构："
          find "$SOURCE_DIR" -maxdepth 3 -type f | sort | head -300

      # --------------------------------------------------
      # 4. 查找 Xcode 工程
      # --------------------------------------------------
      - name: Locate Xcode project
        shell: bash
        run: |
          set -e

          SOURCE_DIR="$RUNNER_TEMP/YunXiOSSource"

          PROJECT_PATH="$(find "$SOURCE_DIR" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "错误：没有找到 .xcodeproj 工程"
            find "$SOURCE_DIR" -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          PROJECT_NAME="$(basename "$PROJECT_PATH")"
          SCHEME_NAME="${PROJECT_NAME%.xcodeproj}"

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "SCHEME_NAME=$SCHEME_NAME" >> "$GITHUB_ENV"

          echo "工程路径：$PROJECT_PATH"
          echo "工程目录：$PROJECT_DIR"
          echo "工程名称：$PROJECT_NAME"
          echo "Scheme：$SCHEME_NAME"

      # --------------------------------------------------
      # 5. 显示工程信息
      # --------------------------------------------------
      - name: Show project information
        shell: bash
        run: |
          set +e

          echo "检查工程信息："

          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

      # --------------------------------------------------
      # 6. 检查 Scheme 是否存在
      # --------------------------------------------------
      - name: Check scheme
        shell: bash
        run: |
          set -e

          echo "检查 Scheme：$SCHEME_NAME"

          if [ ! -d "$PROJECT_PATH" ]; then
            echo "错误：工程不存在"
            exit 1
          fi

          if [ ! -f "$PROJECT_PATH/project.pbxproj" ]; then
            echo "错误：project.pbxproj 不存在"
            exit 1
          fi

          echo "project.pbxproj 存在"

          SCHEME_FILE="$PROJECT_DIR/$PROJECT_NAME/xcshareddata/xcschemes/$SCHEME_NAME.xcscheme"

          if [ -f "$SCHEME_FILE" ]; then
            echo "找到共享 Scheme：$SCHEME_FILE"
          else
            echo "警告：没有找到共享 Scheme 文件"
            echo "尝试使用 xcodebuild 列出 Scheme："

            xcodebuild \
              -project "$PROJECT_PATH" \
              -list
          fi

      # --------------------------------------------------
      # 7. 验证工程
      #
      # 这里故意不执行 clean。
      # 不设置 CONFIGURATION_BUILD_DIR。
      # 避免 Xcode 删除自定义目录时失败。
      # --------------------------------------------------
      - name: Validate project
        shell: bash
        run: |
          set -e

          echo "验证工程构建设置..."

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # --------------------------------------------------
      # 8. 编译 iOS App
      #
      # 重要：
      # 1. 不执行 xcodebuild clean
      # 2. 不设置 CONFIGURATION_BUILD_DIR
      # 3. 只使用 -derivedDataPath
      # --------------------------------------------------
      - name: Build iOS app
        shell: bash
        run: |
          set -e

          DERIVED_DATA="$RUNNER_TEMP/YunXiOSDerivedData"

          rm -rf "$DERIVED_DATA"
          mkdir -p "$DERIVED_DATA"

          echo "开始编译 iOS App..."
          echo "DerivedData：$DERIVED_DATA"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64

          echo "编译完成，查找 App..."

          APP_PATH="$(find "$DERIVED_DATA/Build/Products" \
            -type d \
            -name "*.app" \
            | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "错误：没有找到编译出来的 .app"

            echo "Products 目录内容："
            find "$DERIVED_DATA/Build/Products" -maxdepth 5 -print 2>/dev/null || true

            echo "DerivedData 内容："
            find "$DERIVED_DATA" -maxdepth 5 -print 2>/dev/null || true

            exit 1
          fi

          echo "找到 App："
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 9. 检查 App 文件
      # --------------------------------------------------
      - name: Verify app
        shell: bash
        run: |
          set -e

          if [ -z "$APP_PATH" ]; then
            echo "错误：APP_PATH 为空"
            exit 1
          fi

          if [ ! -d "$APP_PATH" ]; then
            echo "错误：App 不存在：$APP_PATH"
            exit 1
          fi

          echo "App 路径：$APP_PATH"

          echo "App 内容："
          find "$APP_PATH" -maxdepth 2 -type f | sort | head -100

          echo "Info.plist 检查："

          if [ -f "$APP_PATH/Info.plist" ]; then
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist" || true

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleDisplayName" \
              "$APP_PATH/Info.plist" || true

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP_PATH/Info.plist" || true
          else
            echo "错误：App 中没有 Info.plist"
            exit 1
          fi

      # --------------------------------------------------
      # 10. 打包 IPA
      # --------------------------------------------------
      - name: Package IPA
        shell: bash
        run: |
          set -e

          PACKAGE_DIR="$RUNNER_TEMP/YunXiOSPackage"
          PAYLOAD_DIR="$PACKAGE_DIR/Payload"
          IPA_PATH="$GITHUB_WORKSPACE/YunXiOS-unsigned.ipa"

          rm -rf "$PACKAGE_DIR"
          rm -f "$IPA_PATH"

          mkdir -p "$PAYLOAD_DIR"

          echo "复制 App 到 Payload..."

          cp -R "$APP_PATH" "$PAYLOAD_DIR/YunXiOS.app"

          cd "$PACKAGE_DIR"

          echo "开始压缩 IPA..."

          /usr/bin/zip \
            -qry \
            "$IPA_PATH" \
            Payload

          if [ ! -f "$IPA_PATH" ]; then
            echo "错误：IPA 没有生成"
            exit 1
          fi

          echo "IPA 生成成功："
          ls -lh "$IPA_PATH"

          echo "IPA 内容："
          unzip -l "$IPA_PATH" | head -30

      # --------------------------------------------------
      # 11. 上传 IPA
      # --------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YunXiOS-IPA
          path: YunXiOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------
      # 12. 上传 App 原包
      # --------------------------------------------------
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: YunXiOS-App
          path: ${{ env.APP_PATH }}
          if-no-files-found: error
          retention-days: 7
