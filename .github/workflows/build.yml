name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'            # 关键修复：Capacitor 6/7 需要 Node 20+

      - name: 规范化网页目录
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: 初始化移动端壳工程
        run: |
          npm init -y
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/ios@^6
          npx cap init OmniDisk com.omnidisk.app --web-dir www
          npx cap add ios

      - name: 同步 Web 资源与依赖 (拷贝 www + pod install)
        run: npx cap sync ios

      - name: 编译无签名 IPA (TrollStore 专用)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/OmniDisk.app
          zip -r OmniDisk.ipa Payload
          test -f OmniDisk.ipa && echo "IPA 生成成功: $(du -h OmniDisk.ipa | cut -f1)"

      - name: 上传编译好的 IPA 文件
        uses: actions/upload-artifact@v4
        with:
          name: OmniDisk-TrollStore
          path: ios/App/OmniDisk.ipa
