name: Build YunXiOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || true
          xcodebuild -version

      - name: Find and extract source
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -type f -name "*.zip" \
            ! -path "./.git/*" \
            ! -name "YunXiOS-auto-build.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "没有找到源码 ZIP 文件"
            exit 1
          fi

          echo "使用源码压缩包：$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          echo "解压后的文件："
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Xcode project
        shell: bash
        run: |
          set -e

          PROJECT_PATH=$(find extracted -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJECT_PATH" ]; then
            echo "没有找到 .xcodeproj 工程"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_FILE=$(basename "$PROJECT_PATH")

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_FILE=$PROJECT_FILE" >> "$GITHUB_ENV"

          echo "工程路径：$PROJECT_PATH"

      - name: Fix duplicate Info.plist resource
        shell: bash
        run: |
          set -e

          PBXPROJ="$PROJECT_PATH/project.pbxproj"

          if [ -f "$PBXPROJ" ]; then
            echo "修复重复的 Info.plist 资源引用"

            sed -i '' '/Info.plist in Resources/d' "$PBXPROJ" || true

            echo "Info.plist 资源修复完成"
          fi

      - name: Validate project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_FILE" \
            -list

      - name: Build iOS app
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/build"

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme YunXiOS \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -e

          APP_PATH="$GITHUB_WORKSPACE/build/Products/Release-iphoneos/YunXiOS.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "没有找到 YunXiOS.app"
            find "$GITHUB_WORKSPACE/build" -name "*.app" -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/"

          cd "$GITHUB_WORKSPACE/build"
          zip -qry YunXiOS-unsigned.ipa Payload

          echo "IPA 打包完成"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YunXiOS-IPA
          path: build/YunXiOS-unsigned.ipa
          if-no-files-found: error
