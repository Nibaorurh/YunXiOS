name: YunXi
options:
  bundleIdPrefix: com.yunx
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: com.yunx.app
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "14"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  YunXi:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: YunXi
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: YunXi/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.yunx.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        CODE_SIGN_ENTITLEMENTS: YunXi/Resources/YunXi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
